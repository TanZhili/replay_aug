# Condition C of the detector ablation: the whole chain.
#
# Identical to configs/default.yaml except for tail_ms, which is 0 here so that
# all three conditions produce files of exactly the input duration. Use
# default.yaml to actually generate training data; use this one only for the
# controlled comparison described in the README.
#
# See ablation_clean.yaml for why the three files must stay a matched set.

seed: 1234
sr_internal: 48000
variants_per_file: 1

playback:
  enabled: true
  quality: [perfect, high, low]
  quality_weights: [0.15, 0.50, 0.35]
  drive_db: [-9.0, -2.0]
  n_orders: 5
  model_list: null

room:
  enabled: true
  mode: synthetic
  ir_list: null
  t60_s: [0.08, 0.90]
  drr_db: [-3.0, 20.0]
  ir_max_ms: 1500.0

noise:
  enabled: true
  noise_list: null
  snr_db: [12.0, 40.0]

capture:
  enabled: true
  mic_ir_list: null
  agc: true
  agc_target_dbfs: [-26.0, -16.0]
  agc_max_gain_db: 30.0
  adc_headroom_db: [-6.0, 1.0]

transport:
  enabled: true
  codecs: [null, opus, aac, mp3]
  codec_weights: [0.30, 0.40, 0.15, 0.15]
  bitrate_bps: [16000, 64000]
  clock_drift_ppm: [-100.0, 100.0]

output:
  sr: 16000
  peak_db: [-3.0, -1.0]
  subtype: PCM_16
  suffix: .wav
  tail_ms: 0.0
