# Default configuration. Loading this file gives exactly the built-in defaults.
#
# Any numeric field written as [low, high] is sampled per scene or per source, so
# this file describes a distribution of conditions, not a single one.
#
# Environment, device and content *presets* (room sizes, reverberation, placements,
# loudspeaker responses, programme chains...) live in code. Print the effective ones
# with `python -m replay_opus presets`, and override any key in the *_presets /
# presets sections below; overrides are deep-merged over the built-ins.

seed: 1234
sr_internal: 32000        # processing rate; use 48000 if output.sr is 24000 or more
variants_per_file: 1      # render: scenes per input utterance

# Which environments scenes are drawn from, by weight. Built in: living_room,
# bedroom, kitchen, study, car_cabin.
environments:
  living_room: 0.30
  bedroom: 0.15
  kitchen: 0.10
  study: 0.05
  car_cabin: 0.40
environment_presets: {}   # e.g. {car_cabin: {drive_side: right}}, or a whole new environment

talker:                   # the live user
  level_dba: [55.0, 66.0]           # active speech level at 1 m, casual to raised voice
  lombard_onset_dba: 45.0           # noise level where people start raising their voice
  lombard_slope: [0.2, 0.5]         # dB of voice per dB(A) of noise above the onset
  lombard_max_db: 12.0
  effort_tilt_db_per_db: [0.2, 0.4] # raised voice is brighter, soft voice duller

devices:                  # the playback side
  weights: null           # replaces every environment's device mix, e.g. {tv: 1.0}
  volume_slope: [0.0, 0.4]          # how far listeners turn the volume up in noise, dB/dB
  measured: {}            # device kind -> list of near-field responses (from `extract`)
  measured_prob: 0.5      # share of devices of that kind that use a measured response
  presets: {}             # e.g. {tv: {level_dba: [60, 72]}}

content:                  # the delivery chain in front of the loudspeaker
  bed_list: null          # music / effects recordings to mix under programmes
  weights: null           # replaces every device's content mix, e.g. {phone_call: 1.0}
  profiles: {}            # e.g. {streaming: {bed_prob: 0.8}}

# How a device clip's voice reached the loudspeaker. Every form is labelled "device";
# the form is recorded in the manifest (playback_form) and never becomes a label.
playback:
  forms: {single: 0.5, rerecorded: 0.3, replay: 0.2}
  single:                 # a produced programme played once: TV, radio, podcasts
    contents: [broadcast, streaming, radio]
  rerecorded:             # recorded on a phone in another room, then played here:
    environments:         # short videos, voice messages, calls
      living_room: 0.3
      bedroom: 0.25
      kitchen: 0.15
      study: 0.2
      car_cabin: 0.1
    distance_m:           # remote talker to that phone, per delivery chain
      default: [0.3, 2.5]
      phone_call: [0.2, 1.0]
    contents: [streaming, phone_call]
    capture: {agc_prob: 0.8, highpass_prob: 0.9, ns_prob: 0.5}   # over the capture defaults
  replay:                 # recorded by a phone in this very room, then played back here
    distance_m: [0.2, 1.5]                                       # phone to the recorded talker
    capture: {agc_prob: 0.7, highpass_prob: 0.8, ns_prob: 0.2}
    codecs: {aac: 0.45, opus: 0.2, amr_nb: 0.1, none: 0.25}      # how the recording was stored
    bitrate_kbps: {aac: [64.0, 128.0], opus: [24.0, 64.0], amr_nb: [7.95, 12.2]}

room:
  measured: {}            # environment -> list of measured IRs, one directory per room
  measured_mode: hybrid   # hybrid: modelled direct + early part, measured tail; full: as measured
  jitter_m: 0.05          # randomised image positions; breaks up flutter echoes
  early_ms: null          # image-source part length; null picks 2x the mixing time

noise:
  enabled: true
  lists: {}               # family -> list of real noise recordings, e.g. {home: ..., car: ...}

capture:                  # the device the full-duplex model listens through
  fullscale_spl_db: [92.0, 112.0]   # SPL that reaches digital full scale
  self_noise_dba: [22.0, 34.0]      # MEMS microphone self-noise
  mic_ir_list: null                 # measured microphone responses replace the model
  highpass_prob: 0.7
  highpass_hz: [60.0, 150.0]
  ns_prob: 0.0                      # noise suppression; set >0 if your device runs one
  ns_max_db: [8.0, 18.0]
  agc_prob: 0.4
  agc_target_dbfs: [-28.0, -18.0]
  agc_max_gain_db: 24.0
  uplink_prob: 0.0                  # set >0 if audio is coded before your model sees it
  uplink_codecs: {opus: 1.0}
  uplink_bitrate_kbps: [16.0, 32.0]

render:                   # `render`: per-utterance clips
  mode: paired            # paired | mixed | live | device
  device_prob: 0.5        # device share in mixed mode
  tail_ms: 300.0          # reverberant tail kept after the input ends
  origin: dry             # inputs without their own field: dry (TTS, close-talk) | recorded
  recorded_live: skip     # live side of a recorded input: skip | passthrough

scene:                    # `scenes`: full-duplex streams with labels
  duration_s: [10.0, 24.0]
  types: {both: 0.5, device_only: 0.25, live_only: 0.2, empty: 0.05}
  live_utterances: [1, 3]
  live_min_gap_s: 0.4
  device_gap_s: [0.15, 1.2]         # pauses between programme utterances
  device_continuous_prob: 0.7       # a TV that was already on, vs a short burst
  device_voices: [1, 3]             # distinct voices per programme (needs speaker ids)
  second_device_prob: 0.1
  save_stems: false

output:
  sr: 16000
  subtype: PCM_16
  format: wav             # wav | flac - lossless, roughly half the disk space
