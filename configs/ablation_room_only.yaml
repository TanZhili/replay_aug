# Condition B of the detector ablation: room acoustics only.
#
# This is what plain RIR augmentation does, and it is the bar the full chain has
# to clear. Luong et al. (SLT 2024) and ReplayDF both show that convolving with
# an RIR recovers only part of what a real loudspeaker-to-microphone air gap does
# to a detector. If condition C scores the same as this file, the playback,
# noise, capture and transport stages are not contributing anything.
#
# See ablation_clean.yaml for why the three files must stay a matched set.

seed: 1234
sr_internal: 48000
variants_per_file: 1

playback:
  enabled: false

room:
  enabled: true
  mode: synthetic
  ir_list: null
  t60_s: [0.08, 0.90]
  drr_db: [-3.0, 20.0]
  ir_max_ms: 1500.0

noise:
  enabled: false

capture:
  enabled: false

transport:
  enabled: false

output:
  sr: 16000
  peak_db: [-3.0, -1.0]
  subtype: PCM_16
  suffix: .wav
  tail_ms: 0.0
