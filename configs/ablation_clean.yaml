# Control condition A of the detector ablation: every stage off.
#
# Audio still gets resampled to the output rate and peak-normalised, so this is
# the same file handling as the other two conditions with none of the replay
# effect. Without this control, a detector's reaction to 48 kHz clean input
# versus 16 kHz processed input would be read as a reaction to the replay chain.
#
# The three ablation_*.yaml files are a matched set: same seed, same output rate,
# same normalisation, and tail_ms: 0 so that every condition produces a file of
# exactly the input duration. A detector that crops to a fixed window would
# otherwise see a systematic length difference between conditions and score it.

seed: 1234
sr_internal: 48000
variants_per_file: 1

playback:
  enabled: false

room:
  enabled: false
  mode: synthetic

noise:
  enabled: false

capture:
  enabled: false

transport:
  enabled: false

output:
  sr: 16000
  peak_db: [-3.0, -1.0]
  subtype: PCM_16
  suffix: .wav
  tail_ms: 0.0
